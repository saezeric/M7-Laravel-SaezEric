# nixpacks.toml
[phases.setup]
nixPkgs = [
  "php82",
  "php82Packages.composer",
  "php82Packages.pdo_mysql",
  "php82Packages.mbstring",
  "php82Packages.fileinfo",
  "php82Packages.ctype",
  "php82Packages.tokenizer",
  "php82Packages.openssl",
  "php82Packages.curl",
  "git",
  "unzip"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader"
]

[phases.setup.environment]
# Si tu web apunta al public
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT}"

